name: Pull Request Test

on:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Project initialization
        run: ./justw init

      - name: Run Python tool tests
        run: ./justw test-tools

      - name: Validate seed database
        run: ./justw validate-persistence

      - name: Import project
        run: ./justw load-project-headless

      - name: Run Godot unit tests
        run: ./justw test-godot-unit

      - name: Run Godot system tests
        run: ./justw test-godot-system
